name: Deploy to GitHub Pages

# Builds the Vue app and publishes it to GitHub Pages.
# Layout served at https://marcopedersen.github.io/fishcast/ :
#   /            → redirect to /v2/ (v1 retired; also cleans up its old SW)
#   /v2/         → the app (built from v2/ — matches Vite `base: '/fishcast/v2/'`)
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
# (the anon/publishable key is safe to expose in a frontend bundle).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install v2 dependencies
        run: npm ci
        working-directory: v2

      # Gate the deploy on the unit tests — a red suite fails the build and
      # nothing is published.
      - name: Test v2
        run: npm test
        working-directory: v2

      - name: Build v2
        run: npm run build
        working-directory: v2
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Assemble site (redirect at root, app under /v2)
        run: |
          mkdir -p _site/v2
          # v1 is retired: the root is now just a redirect page that also
          # unregisters the old v1 service worker for returning visitors.
          cp index.html _site/index.html
          # The app itself resolves at /fishcast/v2/ (matches Vite `base`).
          cp -r v2/dist/* _site/v2/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
