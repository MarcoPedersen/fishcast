name: Deploy to GitHub Pages

# Builds the v2 (Vue) app and publishes the whole site to GitHub Pages.
# Layout served at https://marcopedersen.github.io/fishcast/ :
#   /            → v1 (static files at the repo root)
#   /v2/         → v2 (built from v2/ — matches Vite `base: '/fishcast/v2/'`)
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
# (the anon/publishable key is safe to expose in a frontend bundle).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install v2 dependencies
        run: npm ci
        working-directory: v2

      - name: Build v2
        run: npm run build
        working-directory: v2
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Assemble site (v1 at root, v2 under /v2)
        run: |
          mkdir -p _site
          # Copy the v1 site (everything at the repo root) excluding tooling/source dirs.
          rsync -a --exclude='_site' \
                   --exclude='.git' \
                   --exclude='.github' \
                   --exclude='.claude' \
                   --exclude='v2' \
                   --exclude='node_modules' \
                   ./ _site/
          # Nest the built v2 app so it resolves at /fishcast/v2/.
          mkdir -p _site/v2
          cp -r v2/dist/* _site/v2/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
