<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FishCast</title>
  <meta http-equiv="refresh" content="0; url=./v2/" />
  <link rel="canonical" href="./v2/" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #07111f; color: #e6edf6;
           font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .box { text-align: center; padding: 24px; }
    .fish { font-size: 2.5rem; }
    h1 { font-size: 1.2rem; font-weight: 600; margin: 12px 0 6px; }
    p { font-size: .88rem; color: #7d93ad; margin: 0 0 16px; }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="box">
    <div class="fish">🎣</div>
    <h1>FishCast er flyttet</h1>
    <p>Du sendes videre til den nye version…</p>
    <a href="./v2/">Åbn FishCast →</a>
  </div>

  <script>
    // The old v1 app registered a service worker at this scope, which would keep
    // serving its cached shell to anyone who had visited before. Retire it:
    // unregister the SW and drop only its caches (fishcast-vNN) — v2's workbox
    // caches (fishcast-api, osm-tiles, workbox-*) live under /v2/ and are left
    // untouched.
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(
            regs
              .filter((r) => !r.scope.includes('/v2/'))
              .map((r) => r.unregister())
          );
        }
        if (window.caches) {
          const names = await caches.keys();
          await Promise.all(
            names.filter((n) => /^fishcast-v\d+$/.test(n)).map((n) => caches.delete(n))
          );
        }
      } catch (e) { /* best effort — the meta refresh still moves the user on */ }
      location.replace('./v2/');
    })();
  </script>
</body>
</html>
