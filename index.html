<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#38bdf8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>FishCast — Smart Fishing Planner</title>
  <link rel="manifest" href="manifest.json" />

  <link rel="stylesheet" href="style.css?v=54" />

<body>
  <div id="app">
    <div class="loader-screen" id="init-loader">
      <div class="loader-fish">🎣</div>

  </div>

  <script src="app.js?v=54"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/fishcast/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
